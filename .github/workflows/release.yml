name: Create Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version name for the release (e.g., 2.0.0)'
        required: true
        default: '2.0.0'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '7.4'
          tools: composer

      - name: Normalise version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          VERSION="${VERSION#v}"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$VERSION" >> "$GITHUB_ENV"

      - name: Check plugin header version matches
        run: |
          grep -q "Version:           ${VERSION}$" ai-comment-moderator.php || { echo "::error::Plugin header version does not match ${VERSION}"; exit 1; }

      - name: Install Composer dependencies (autoloader only)
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Build plugin zip
        run: |
          mkdir -p build/ai-comment-moderator
          rsync -a ./ build/ai-comment-moderator/ \
            --exclude '.git*' --exclude '.github' --exclude '.wordpress-org' --exclude 'build' --exclude 'tests' \
            --exclude 'composer.json' --exclude 'composer.lock' --exclude '*.yml' --exclude 'phpunit.xml*'
          cd build && zip -rq ../ai-comment-moderator.zip ai-comment-moderator

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: AI Comment Moderator ${{ env.TAG }}
          generate_release_notes: true
          files: ai-comment-moderator.zip
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
